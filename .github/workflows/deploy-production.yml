name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bid-support-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to mirror
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      OIDC_CLIENT_SECRET: ${{ secrets.PROD_OIDC_CLIENT_SECRET }}
      AUTH_SESSION_SECRET: ${{ secrets.PROD_AUTH_SESSION_SECRET }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS DATABASE_URL OIDC_CLIENT_SECRET AUTH_SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Prepare production environment
        run: |
          set -euo pipefail
          cat > frontend/.env.production <<EOF
          DATABASE_URL=$DATABASE_URL
          OIDC_ISSUER_URL=https://sso.mi-rror.com
          OIDC_CLIENT_ID=bid-support
          OIDC_CLIENT_SECRET=$OIDC_CLIENT_SECRET
          OIDC_REDIRECT_URI=https://bid.mi-rror.com/api/auth/callback
          BID_SUPPORT_LOGIN_URL=https://bid.mi-rror.com/login
          NEXT_PUBLIC_MIRROR_SSO_URL=https://sso.mi-rror.com
          AUTH_SESSION_SECRET=$AUTH_SESSION_SECRET
          EOF

      - name: Build frontend
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build
          tar -C frontend -czf "$RUNNER_TEMP/bid-support-frontend-build.tar.gz" .next

      - name: Upload deployment files
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes frontend/.env.production "$RUNNER_TEMP/bid-support-frontend-build.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Activate release and restart services
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" <<'EOF'
          set -euo pipefail
          cd /var/www/bid-support
          git pull --ff-only origin main
          # 収集サービスはリポジトリ外のループスクリプトを実行するため、
          # デプロイごとに正しいパスの版へ同期する。
          install -d -m 755 collector/loops
          install -m 755 deploy/loops/gifu.sh collector/loops/gifu.sh
          install -m 755 deploy/loops/nexco-east.sh collector/loops/nexco-east.sh
          mv /tmp/.env.production frontend/.env.production
          npm --prefix collector ci
          npm --prefix frontend ci --omit=dev
          release_dir=$(mktemp -d /var/www/bid-support/frontend/.next-release.XXXXXX)
          tar -xzf /tmp/bid-support-frontend-build.tar.gz -C "$release_dir"
          rm -rf frontend/.next
          mv "$release_dir/.next" frontend/.next
          rmdir "$release_dir"
          rm -f /tmp/bid-support-frontend-build.tar.gz
          pm2 reload bid-support-frontend --update-env
          sudo systemctl try-restart bid-support-gifu bid-support-nexco-east
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:4102/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become healthy within 30 seconds" >&2
          exit 1
          EOF
