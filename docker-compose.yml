services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tender_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/tender_support
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:4000}
      OIDC_CLIENT_ID: bid-support
      OIDC_CLIENT_SECRET: ${BID_SUPPORT_CLIENT_SECRET:-bid-support-dev-secret}
      OIDC_REDIRECT_URI: ${BID_SUPPORT_ORIGIN:-http://localhost:3000}/api/auth/callback
    depends_on:
      - db

volumes:
  postgres_data:
